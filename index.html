<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебные материалы</title>
<style>
:root{--bg:#eceee9;--fg:#1c2220;--muted:#6b746f;--card:#fbfbf7;--line:#d5d9d2;--accent:#1d5bd6}
@media (prefers-color-scheme:dark){:root{--bg:#121618;--fg:#e4e7e1;--muted:#9aa49f;--card:#1a1f22;--line:#2c3337;--accent:#6f9dff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "PT Sans","Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:16px}

a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{color:var(--accent);font-size:18px}
p{margin:4px 0 0;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Учебные материалы</h1>

</body>
</html>
